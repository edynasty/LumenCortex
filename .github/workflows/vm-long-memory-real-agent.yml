name: vm-long-memory-real-agent

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-long-memory-real-agent.yml"
  workflow_dispatch:

jobs:
  long-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst -o /tmp/ollama.tar.zst
          sudo tar --zstd -xf /tmp/ollama.tar.zst -C /usr
          OLLAMA_CONTEXT_LENGTH=8192 nohup ollama serve >/tmp/ollama-long.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/version >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Pull official tool-capable model
        run: ollama pull qwen3:1.7b

      - name: Build long-memory fixture
        shell: bash
        run: |
          rm -rf .modelweave memory-long
          mkdir -p memory-long
          for i in 01 02 03 04 05 06 07 08; do
            value=$((9100 + 10#$i * 23))
            printf 'VALUE_%s=%s\n' "$i" "$value" > "memory-long/item-$i.txt"
          done
          cat > memory-long/verify.mjs <<'EOF'
          import fs from 'node:fs';
          const expected = [];
          for (let i = 1; i <= 8; i += 1) {
            const n = String(i).padStart(2, '0');
            const line = fs.readFileSync(new URL(`./item-${n}.txt`, import.meta.url), 'utf8').trim();
            expected.push(Number(line.split('=')[1]));
          }
          const report = JSON.parse(fs.readFileSync(new URL('./report.json', import.meta.url), 'utf8'));
          if (JSON.stringify(report.values) !== JSON.stringify(expected)) {
            console.error(JSON.stringify({expected, actual: report.values}));
            process.exit(1);
          }
          console.log('GRAPH_MEMORY_LONG_TASK_OK');
          EOF
          node src/cli.js init .
          node src/cli.js ingest memory-long
          node src/cli.js commit "long-memory baseline"

      - name: Run real-model long-memory task
        env:
          MODELWEAVE_PROVIDER: generic
          MODELWEAVE_BASE_URL: http://127.0.0.1:11434/v1
          MODELWEAVE_MODEL: qwen3:1.7b
          MODELWEAVE_REQUIRE_API_KEY: "false"
        shell: bash
        run: |
          set -o pipefail
          node src/cli.js agent \
            "This is a long-memory protocol test. Read memory-long/item-01.txt through item-08.txt in filename order. Use read_file only for these item files, never reread an item, and read exactly one item file per reasoning turn. After all eight reads, create memory-long/report.json as {\"values\":[v1,v2,v3,v4,v5,v6,v7,v8]} using every observed numeric value in order. Then run node memory-long/verify.mjs with shell. If verification succeeds, return GRAPH_MEMORY_LONG_TASK_OK. Do not finish earlier. /no_think" \
            --provider generic \
            --model qwen3:1.7b \
            --base-url http://127.0.0.1:11434/v1 \
            --budget 3200 \
            --recent-rounds 1 \
            --working-chars 7000 \
            --timeout-ms 240000 \
            --llm-retries 1 \
            --max-tool-calls-per-step 1 \
            --tools read_file,write_file,shell \
            --max-tokens 256 \
            --max-steps 16 \
            --yes | tee /tmp/memory-long-agent.log

          node memory-long/verify.mjs
          grep -F 'GRAPH_MEMORY_LONG_TASK_OK' /tmp/memory-long-agent.log

          for i in 01 02 03 04 05 06 07 08; do
            count=$(grep -c "→ read_file .*memory-long/item-$i.txt" /tmp/memory-long-agent.log || true)
            echo "item-$i reads=$count"
            [ "$count" -eq 1 ]
          done

          grep -E '→ write_file .*memory-long/report.json' /tmp/memory-long-agent.log
          grep -E '→ shell .*verify.mjs' /tmp/memory-long-agent.log

          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const dir = '.modelweave/sessions';
          const files = fs.readdirSync(dir).filter(x => x.endsWith('.json'));
          const sessions = files.map(x => JSON.parse(fs.readFileSync(`${dir}/${x}`, 'utf8')))
            .sort((a,b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
          const s = sessions[0];
          if (s.status !== 'completed') throw new Error(`status=${s.status}`);
          if ((s.metadata?.contextHistory?.length ?? 0) !== s.steps.length) {
            throw new Error('contextHistory does not match reasoning steps');
          }

          const readCalls = s.steps.flatMap(step =>
            (step.toolCalls ?? [])
              .filter(call => call.name === 'read_file' && String(call.args?.path ?? '').startsWith('memory-long/item-'))
              .map(call => ({ step: step.step, path: call.args.path, observationId: call.observationId }))
          );
          if (readCalls.length !== 8) throw new Error(`readCalls=${readCalls.length}`);

          const distinctReadSteps = [...new Set(readCalls.map(call => call.step))];
          if (distinctReadSteps.length !== 8) {
            throw new Error(`expected 8 distinct read reasoning steps, got ${distinctReadSteps.join(',')}`);
          }

          const writeStep = s.steps.find(step =>
            (step.toolCalls ?? []).some(call =>
              call.name === 'write_file' && call.args?.path === 'memory-long/report.json'
            )
          );
          if (!writeStep) throw new Error('missing report write step');

          const writeContext = s.metadata.contextHistory.find(item => item.step === writeStep.step);
          if (!writeContext) throw new Error('missing write-step context history');

          const readObservationIds = readCalls.map(call => call.observationId).filter(Boolean);
          const missingFromActiveGraph = readObservationIds.filter(id => !writeContext.nodeIds.includes(id));
          if (missingFromActiveGraph.length) {
            throw new Error(`write-step Active Subgraph missed old read observations: ${missingFromActiveGraph.join(',')}`);
          }

          const earliestReadStep = Math.min(...distinctReadSteps);
          if (writeStep.step - earliestReadStep < 3) {
            throw new Error('oldest read was not old enough to be paged out of recentRounds=1 history');
          }

          console.log(JSON.stringify({
            status: s.status,
            steps: s.steps.length,
            readSteps: distinctReadSteps,
            writeStep: writeStep.step,
            activeReadObservationsAtWrite: readObservationIds.length,
            contextHistory: s.metadata.contextHistory.length,
            observations: s.metadata.recentObservationNodeIds.length,
            promotions: s.metadata.promotions?.length ?? 0,
            usage: s.usage
          }, null, 2));
          EOF

      - name: Logs
        if: always()
        shell: bash
        run: |
          cat /tmp/memory-long-agent.log 2>/dev/null || true
          tail -80 /tmp/ollama-long.log 2>/dev/null || true
