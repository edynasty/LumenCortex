name: vm-real-agent-smoke
# Real local-model proof for the standalone coding-agent loop.
# Long-memory graph reactivation is validated separately in vm-long-memory-real-agent.yml.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-real-agent-smoke.yml"
      - "src/agent.js"
      - "src/cli.js"
      - "src/tools.js"
      - "src/provider.js"
      - "src/tui.js"
  workflow_dispatch:

concurrency:
  group: vm-real-agent-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project
        run: npm ci

      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst -o /tmp/ollama.tar.zst
          sudo tar --zstd -xf /tmp/ollama.tar.zst -C /usr
          ollama --version
          OLLAMA_CONTEXT_LENGTH=8192 nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull tool-calling model
        run: ollama pull qwen3:4b-instruct

      - name: Verify local OpenAI-compatible endpoint
        env:
          LUMENCORTEX_PROVIDER: generic
          LUMENCORTEX_BASE_URL: http://127.0.0.1:11434/v1
          LUMENCORTEX_MODEL: qwen3:4b-instruct
          LUMENCORTEX_REQUIRE_API_KEY: "false"
        run: |
          node src/cli.js doctor --provider generic --live

      - name: Prepare real coding fixture
        shell: bash
        run: |
          rm -rf .lumencortex vm-code
          mkdir -p vm-code/src vm-code/test

          cat > vm-code/package.json <<'EOF'
          {
            "name": "lumencortex-vm-code-fixture",
            "type": "module",
            "scripts": { "test": "node --test" }
          }
          EOF

          cat > vm-code/src/math.js <<'EOF'
          export function add(a, b) {
            return a - b;
          }

          export function clamp(value, min, max) {
            return Math.max(max, Math.min(min, value));
          }
          EOF

          cat > vm-code/src/slug.js <<'EOF'
          export function slugify(value) {
            return value.replaceAll(' ', '_');
          }
          EOF

          cat > vm-code/test/math.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { add, clamp } from '../src/math.js';

          test('add sums two values', () => {
            assert.equal(add(7, 5), 12);
          });

          test('clamp keeps a value inside the requested range', () => {
            assert.equal(clamp(5, 0, 10), 5);
            assert.equal(clamp(-2, 0, 10), 0);
            assert.equal(clamp(99, 0, 10), 10);
          });
          EOF

          cat > vm-code/test/slug.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { slugify } from '../src/slug.js';

          test('slugify normalizes human labels', () => {
            assert.equal(slugify('  Hello   Lumen Cortex  '), 'hello-lumen-cortex');
          });
          EOF

          sha256sum vm-code/test/*.js > /tmp/vm-code-tests.sha

          node src/cli.js init .
          node src/cli.js ingest vm-code
          node src/cli.js commit "real coding fixture"

          set +e
          (cd vm-code && npm test) >/tmp/vm-code-pretest.log 2>&1
          status=$?
          set -e
          cat /tmp/vm-code-pretest.log
          [ "$status" -ne 0 ]

      - name: Run real local-model autonomous coding task
        timeout-minutes: 18
        shell: bash
        env:
          LUMENCORTEX_PROVIDER: generic
          LUMENCORTEX_BASE_URL: http://127.0.0.1:11434/v1
          LUMENCORTEX_MODEL: qwen3:4b-instruct
          LUMENCORTEX_REQUIRE_API_KEY: "false"
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 900s node src/cli.js agent \
            "Work only in vm-code. This is an implementation task, not a review. First run npm test in vm-code. Diagnose every failing test. Fix only implementation files under vm-code/src; do not edit tests. Rerun npm test until every test passes. There are independent bugs in math.js and slug.js, so do not stop after the first fix. Before finishing, inspect the resulting files or diff. Return CODE_TASK_OK only after tests pass." \
            --provider generic \
            --model qwen3:4b-instruct \
            --base-url http://127.0.0.1:11434/v1 \
            --budget 2400 \
            --recent-rounds 3 \
            --working-chars 26000 \
            --timeout-ms 300000 \
            --max-tokens 512 \
            --max-steps 10 \
            --max-tool-calls-per-step 3 \
            --tools read_file,replace_in_file,apply_patch,shell \
            --yes | tee /tmp/vm-code-agent.log

          echo "--- independent verification ---"
          (cd vm-code && npm test)
          sha256sum -c /tmp/vm-code-tests.sha

          echo "--- tool evidence ---"
          grep -E '→ (shell|read_file|replace_in_file|apply_patch)' /tmp/vm-code-agent.log | tee /tmp/vm-code-tool-lines.log
          tool_count=$(wc -l < /tmp/vm-code-tool-lines.log)
          echo "TOOL_CALLS=$tool_count"
          [ "$tool_count" -ge 5 ]
          grep -E '→ (replace_in_file|apply_patch)' /tmp/vm-code-agent.log
          grep -E '→ shell .*npm test' /tmp/vm-code-agent.log
          grep -F '[agent] completed' /tmp/vm-code-agent.log
          grep -F 'CODE_TASK_OK' /tmp/vm-code-agent.log

      - name: Verify persisted coding session
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import path from 'node:path';
          import { AgentSessionStore } from './src/session.js';

          const store = new AgentSessionStore(path.resolve('.lumencortex'));
          const latest = store.list(1)[0];
          if (!latest) throw new Error('missing persisted coding session');
          const session = store.load(latest.id);
          if (session.status !== 'completed') throw new Error(`status=${session.status}`);
          const names = session.steps.flatMap(step => (step.toolCalls ?? []).map(call => call.name));
          if (!names.includes('shell')) throw new Error('missing shell verification call');
          if (!names.some(name => name === 'replace_in_file' || name === 'apply_patch')) {
            throw new Error('missing implementation edit call');
          }
          console.log(JSON.stringify({
            id: session.id,
            status: session.status,
            steps: session.steps.length,
            requests: session.usage?.requests ?? null,
            totalTokens: session.usage?.totalTokens ?? null,
            toolCalls: names.length
          }, null, 2));
          store.close();
          EOF

      - name: Show session evidence
        if: always()
        shell: bash
        run: |
          node src/cli.js sessions --limit 3 || true
          echo "--- coding agent log ---"
          cat /tmp/vm-code-agent.log 2>/dev/null || true
          echo "--- pre-test ---"
          cat /tmp/vm-code-pretest.log 2>/dev/null || true
          echo "--- ollama tail ---"
          tail -100 /tmp/ollama.log 2>/dev/null || true
