name: vm-real-agent-smoke
# validates real local tool-calling against the bounded moving-context agent loop

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-real-agent-smoke.yml"

jobs:
  real-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project
        run: npm ci

      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst -o /tmp/ollama.tar.zst
          sudo tar --zstd -xf /tmp/ollama.tar.zst -C /usr
          ollama --version
          OLLAMA_CONTEXT_LENGTH=8192 nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull tool-calling model
        run: ollama pull qwen3:4b-instruct

      - name: Prepare smoke workspace
        shell: bash
        run: |
          rm -rf .modelweave vm-smoke
          mkdir -p vm-smoke
          printf 'The VM-only secret code is 731942.\n' > vm-smoke/secret.txt
          printf 'export function add(a,b){ return a-b }\n' > vm-smoke/calc.js
          node src/cli.js init .
          node src/cli.js ingest .
          node src/cli.js commit "vm smoke baseline"

      - name: Verify local OpenAI-compatible endpoint
        env:
          MODELWEAVE_PROVIDER: generic
          MODELWEAVE_BASE_URL: http://127.0.0.1:11434/v1
          MODELWEAVE_MODEL: qwen3:4b-instruct
          MODELWEAVE_REQUIRE_API_KEY: "false"
        run: |
          node src/cli.js doctor --provider generic --live

      - name: Run real LLM agent loop
        id: agent
        continue-on-error: true
        env:
          MODELWEAVE_PROVIDER: generic
          MODELWEAVE_BASE_URL: http://127.0.0.1:11434/v1
          MODELWEAVE_MODEL: qwen3:4b-instruct
          MODELWEAVE_REQUIRE_API_KEY: "false"
        shell: bash
        run: |
          set -o pipefail
          node src/cli.js agent \
            "Use the available tools to read vm-smoke/secret.txt. Do not guess. Return the exact numeric secret as SECRET=<number>. You must inspect the file before answering." \
            --provider generic \
            --model qwen3:4b-instruct \
            --base-url http://127.0.0.1:11434/v1 \
            --budget 900 \
            --recent-rounds 3 \
            --working-chars 24000 \
            --max-tokens 192 \
            --yes \
            --max-steps 8 | tee /tmp/agent.log

          grep -E "→ read_file|→ search_text" /tmp/agent.log || true
          grep -F "SECRET=731942" /tmp/agent.log || true

      - name: Prepare real-model long task
        shell: bash
        run: |
          rm -rf vm-long
          mkdir -p vm-long
          for i in 01 02 03 04 05 06 07 08; do
            value=$((7300 + 10#$i * 17))
            printf 'item-%s=%s\n' "$i" "$value" > "vm-long/item-$i.txt"
          done
          cat > vm-long/task.txt <<'EOF'
          Read every item-01.txt through item-08.txt with tools.
          Create vm-long/report.json containing:
          {"values":[item01,item02,item03,item04,item05,item06,item07,item08]}
          with numeric values in filename order.
          Then run: node vm-long/verify.mjs
          Do not finish until verification succeeds.
          EOF
          cat > vm-long/verify.mjs <<'EOF'
          import fs from 'node:fs';
          const expected = [];
          for (let i = 1; i <= 8; i += 1) {
            const n = String(i).padStart(2, '0');
            const text = fs.readFileSync(new URL(`./item-${n}.txt`, import.meta.url), 'utf8');
            expected.push(Number(text.trim().split('=')[1]));
          }
          const actual = JSON.parse(fs.readFileSync(new URL('./report.json', import.meta.url), 'utf8'));
          if (JSON.stringify(actual.values) !== JSON.stringify(expected)) {
            console.error({ expected, actual });
            process.exit(1);
          }
          console.log('LONG_TASK_OK');
          EOF

      - name: Run real local-model long task
        shell: bash
        env:
          MODELWEAVE_PROVIDER: generic
          MODELWEAVE_BASE_URL: http://127.0.0.1:11434/v1
          MODELWEAVE_MODEL: qwen3:4b-instruct
          MODELWEAVE_REQUIRE_API_KEY: "false"
        run: |
          set -o pipefail
          node src/cli.js agent \
            "Follow vm-long/task.txt exactly. Use read_file on every item file, create the requested report, run the verifier, and continue until it prints LONG_TASK_OK." \
            --provider generic \
            --model qwen3:4b-instruct \
            --base-url http://127.0.0.1:11434/v1 \
            --budget 1200 \
            --recent-rounds 3 \
            --working-chars 30000 \
            --max-tokens 384 \
            --max-steps 20 \
            --yes | tee /tmp/agent-long.log

          node vm-long/verify.mjs
          grep -F "LONG_TASK_OK" /tmp/agent-long.log
          read_count=$(grep -E '→ read_file .*vm-long/item-' /tmp/agent-long.log | wc -l)
          echo "ITEM_READ_CALLS=$read_count"
          [ "$read_count" -ge 8 ]
          grep -E '→ (write_file|replace_in_file).*vm-long/report.json' /tmp/agent-long.log
          grep -E '→ shell .*verify.mjs' /tmp/agent-long.log

      - name: Show session evidence
        if: always()
        shell: bash
        run: |
          node src/cli.js sessions --limit 3 || true
          echo "--- agent log ---"
          cat /tmp/agent.log 2>/dev/null || true
          echo "--- ollama tail ---"
          tail -100 /tmp/ollama.log 2>/dev/null || true
